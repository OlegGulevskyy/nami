[project]
name = "nami-server"
version = "0.1.0"
description = "Nami inference server: speech recognition and transcript cleanup for devices on your network."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.32",
    "numpy>=2.3",
]

[project.optional-dependencies]
# Apple Silicon: the same Parakeet v3 and Qwen 3 weights the app runs on-device, on MLX.
mlx = [
    "parakeet-mlx>=0.5.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
nami-server = "nami_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2.13", "ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
